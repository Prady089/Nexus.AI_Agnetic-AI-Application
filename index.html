<!DOCTYPE html>
<html class="dark" lang="UTF-8">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>NEXUS.AI</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography,container-queries"></script>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&family=Orbitron:wght@400;700;900&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <style type="text/tailwindcss">
        :root {
            --obsidian: #020408;
            --teal-glow: #2dd4bf;
            --purple-glow: #a855f7;
            --lime-neon: #a3e635;
            --hot-pink: #fb218b;
            --glass: rgba(255, 255, 255, 0.03);
            --accent: var(--teal-glow);
            --accent-glow: rgba(45, 212, 191, 0.4);
            --border: rgba(255, 255, 255, 0.08);
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(2deg); }
        }
        @keyframes rotate-text {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        @keyframes pulse-organic {
            0%, 100% { transform: scale(1); opacity: 0.8; filter: blur(4px); }
            50% { transform: scale(1.05); opacity: 1; filter: blur(8px); }
        }
        @keyframes neural-drift {
            from { background-position: 0 0; }
            to { background-position: 100% 100%; }
        }
        .neural-bg {
            background-color: var(--obsidian);
            background-image: 
                radial-gradient(circle at 2px 2px, rgba(45, 212, 191, 0.05) 1px, transparent 0);
            background-size: 40px 40px;
            position: fixed;
            inset: 0;
            z-index: -1;
        }
        .glass-header {
            background: linear-gradient(90deg, rgba(45, 212, 191, 0.05) 0%, rgba(168, 85, 247, 0.05) 100%);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        .organic-bubble {
            border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            animation: float 6s ease-in-out infinite;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .organic-bubble.active {
            background: rgba(45, 212, 191, 0.15);
            border-color: var(--teal-glow);
            box-shadow: 0 0 40px rgba(45, 212, 191, 0.4), inset 0 0 20px rgba(45, 212, 191, 0.2);
            transform: scale(1.15);
            filter: brightness(1.2);
        }
        .organic-bubble.active .material-symbols-outlined {
            color: white;
            text-shadow: 0 0 10px var(--teal-glow);
        }
        .organic-bubble.complete {
            border-color: var(--lime-neon);
            background: rgba(163, 230, 53, 0.1);
        }
        .circular-editor {
            border-radius: 50%;
            aspect-ratio: 1/1;
            background: radial-gradient(circle at center, rgba(15, 23, 42, 0.9) 0%, var(--obsidian) 70%);
            position: relative;
            box-shadow: 0 0 60px rgba(168, 85, 247, 0.1);
        }
        .scrolling-thought {
            position: absolute;
            width: 120%;
            height: 120%;
            top: -10%;
            left: -10%;
            animation: rotate-text 20s linear infinite;
            pointer-events: none;
        }
        .holo-projection {
            background: linear-gradient(135deg, rgba(45, 212, 191, 0.05) 0%, transparent 100%);
            mask-image: linear-gradient(to bottom, black 80%, transparent 100%);
        }
        .code-wrap {
            font-family: 'Fira Code', monospace;
            shape-outside: circle(50%);
        }
        .neon-lime { color: var(--lime-neon); text-shadow: 0 0 8px rgba(163, 230, 53, 0.6); }
        .neon-pink { color: var(--hot-pink); text-shadow: 0 0 8px rgba(251, 33, 139, 0.6); }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }

        /* LOG STYLES */
        .log-container {
            height: 100%;
            overflow-y: auto;
            padding: 20px;
            font-family: 'Fira Code', monospace;
            scrollbar-width: none;
        }
        .log-container::-webkit-scrollbar { display: none; }
        .log-entry {
            margin-bottom: 24px;
            animation: fadeIn 0.5s ease-out;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .log-agent {
            color: var(--teal-glow);
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.6rem;
            letter-spacing: 0.2em;
            margin-bottom: 8px;
        }
        .log-text {
            color: #94a3b8;
            font-size: 0.75rem;
            line-height: 1.6;
        }
        .log-file {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 100px;
            font-size: 0.6rem;
            margin-top: 12px;
            color: #cbd5e1;
            margin-right: 8px;
        }
        #previewFrame {
            width: 100%;
            height: 100%;
            border: none;
            background: transparent;
            border-radius: 20px;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>

<body class="neural-bg text-slate-200 font-['Outfit'] overflow-hidden">
    <header class="glass-header h-16 fixed top-0 w-full z-50 flex items-center justify-between px-8">
        <div class="flex items-center gap-4">
            <div
                class="w-8 h-8 rounded-full bg-gradient-to-tr from-[var(--teal-glow)] to-[var(--purple-glow)] blur-[4px] absolute opacity-50">
            </div>
            <h1
                class="font-['Orbitron'] text-2xl font-black tracking-[0.4em] relative z-10 bg-clip-text text-transparent bg-gradient-to-r from-[var(--teal-glow)] to-[var(--purple-glow)]">
                NEXUS.AI</h1>
        </div>
        <div class="flex items-center gap-6 text-xs font-medium tracking-widest text-slate-400">
            <span class="hover:text-[var(--teal-glow)] cursor-pointer transition-colors uppercase"
                id="statusBadge">Network Status: Stable</span>

            <div class="flex -space-x-2">
                <div
                    class="w-8 h-8 rounded-full border border-white/20 bg-slate-800 flex items-center justify-center overflow-hidden">
                    <img src="/workspace/host_image.jpg" class="w-full h-full object-cover" alt="Profile">
                </div>
            </div>
        </div>
    </header>
    <main class="pt-20 h-screen grid grid-cols-12 gap-6 p-6">
        <!-- AGENT BUBBLES -->
        <aside class="col-span-3 flex flex-col justify-start relative py-2 px-1">
            <div
                class="absolute inset-0 bg-gradient-to-r from-[var(--teal-glow)]/5 to-transparent blur-3xl rounded-full pointer-events-none">
            </div>

            <!-- PLANNER (Left) -->
            <div class="relative w-32 h-32 group cursor-pointer shrink-0 self-start ml-4" id="node-planner">
                <div class="scrolling-thought">
                    <svg class="w-full h-full fill-slate-500 text-[2.5px] uppercase tracking-widest"
                        viewBox="0 0 100 100">
                        <path d="M 50, 50 m -45, 0 a 45,45 0 1,1 90,0 a 45,45 0 1,1 -90,0" fill="transparent"
                            id="curve0"></path>
                        <text>
                            <textPath href="#curve0">Mapping objectives... Orchestrating pathways...</textPath>
                        </text>
                    </svg>
                </div>
                <div
                    class="organic-bubble absolute inset-0 flex flex-col items-center justify-center p-2 text-center z-10 transition-transform group-hover:scale-105">
                    <div
                        class="w-8 h-8 rounded-full bg-blue-500/10 flex items-center justify-center mb-1 shadow-[0_0_10px_rgba(59,130,246,0.2)]">
                        <span class="material-symbols-outlined text-blue-400 text-lg">psychology_alt</span>
                    </div>
                    <span class="text-[9px] font-bold tracking-tighter text-blue-400 uppercase">Planner</span>
                </div>
            </div>

            <!-- BA (Right) -->
            <div class="relative w-32 h-32 group cursor-pointer shrink-0 self-end mr-4 -mt-10" id="node-ba">
                <div class="scrolling-thought" style="animation-duration: 25s;">
                    <svg class="w-full h-full fill-slate-500 text-[2.8px] uppercase tracking-widest"
                        viewBox="0 0 100 100">
                        <path d="M 50, 50 m -45, 0 a 45,45 0 1,1 90,0 a 45,45 0 1,1 -90,0" fill="transparent"
                            id="curve1"></path>
                        <text>
                            <textPath href="#curve1">Defining constraints... Extracting reqs...</textPath>
                        </text>
                    </svg>
                </div>
                <div class="organic-bubble absolute inset-0 flex flex-col items-center justify-center p-2 text-center z-10 transition-transform group-hover:scale-105"
                    style="border-radius: 60% 40% 70% 30% / 50% 60% 40% 50%;">
                    <div
                        class="w-8 h-8 rounded-full bg-[var(--teal-glow)]/10 flex items-center justify-center mb-1 shadow-[0_0_15px_rgba(45,212,191,0.2)]">
                        <span class="material-symbols-outlined text-[var(--teal-glow)] text-xl">architecture</span>
                    </div>
                    <span class="text-[9px] font-bold tracking-tighter text-[var(--teal-glow)] uppercase">BA</span>
                </div>
            </div>

            <!-- ARCHITECT (Left) -->
            <div class="relative w-32 h-32 group cursor-pointer shrink-0 self-start ml-4 -mt-10" id="node-arch">
                <div class="scrolling-thought" style="animation-duration: 22s;">
                    <svg class="w-full h-full fill-slate-500 text-[2.8px] uppercase tracking-widest"
                        viewBox="0 0 100 100">
                        <path d="M 50, 50 m -45, 0 a 45,45 0 1,1 90,0 a 45,45 0 1,1 -90,0" fill="transparent"
                            id="curve3"></path>
                        <text>
                            <textPath href="#curve3">Architecting systems... Mapping nodes...</textPath>
                        </text>
                    </svg>
                </div>
                <div class="organic-bubble absolute inset-0 flex flex-col items-center justify-center p-2 text-center z-10 transition-transform group-hover:scale-105"
                    style="animation-delay: -1s; border-radius: 40% 60% 30% 70% / 60% 30% 70% 40%;">
                    <div class="w-8 h-8 rounded-full bg-amber-500/10 flex items-center justify-center mb-1">
                        <span class="material-symbols-outlined text-amber-400 text-lg">hub</span>
                    </div>
                    <span class="text-[9px] font-bold tracking-tighter text-amber-400 uppercase">Architect</span>
                </div>
            </div>

            <!-- DEVELOPER (Right) -->
            <div class="relative w-32 h-32 group cursor-pointer shrink-0 self-end mr-4 -mt-10" id="node-dev">
                <div class="scrolling-thought" style="animation-direction: reverse; animation-duration: 25s;">
                    <svg class="w-full h-full fill-slate-500 text-[3.5px] uppercase tracking-widest"
                        viewBox="0 0 100 100">
                        <path d="M 50, 50 m -40, 0 a 40,40 0 1,1 80,0 a 40,40 0 1,1 -80,0" fill="transparent"
                            id="curve2"></path>
                        <text>
                            <textPath href="#curve2">Generating modules... Synthesizing logic...</textPath>
                        </text>
                    </svg>
                </div>
                <div class="organic-bubble absolute inset-0 flex flex-col items-center justify-center p-2 text-center z-10 transition-transform group-hover:scale-105"
                    style="animation-delay: -2s; border-radius: 60% 40% 30% 70% / 50% 30% 70% 50%;">
                    <div
                        class="w-8 h-8 rounded-full bg-[var(--purple-glow)]/10 flex items-center justify-center mb-1 shadow-[0_0_15px_rgba(168,85,247,0.2)]">
                        <span class="material-symbols-outlined text-[var(--purple-glow)] text-lg">code</span>
                    </div>
                    <span
                        class="text-[9px] font-bold tracking-tighter text-[var(--purple-glow)] uppercase">Developer</span>
                </div>
            </div>

            <!-- QA (Left) -->
            <div class="relative w-32 h-32 group cursor-pointer shrink-0 self-start ml-4 -mt-10" id="node-qa">
                <div class="scrolling-thought" style="animation-duration: 28s; animation-direction: reverse;">
                    <svg class="w-full h-full fill-slate-500 text-[3px] uppercase tracking-widest"
                        viewBox="0 0 100 100">
                        <path d="M 50, 50 m -45, 0 a 45,45 0 1,1 90,0 a 45,45 0 1,1 -90,0" fill="transparent"
                            id="curve4"></path>
                        <text>
                            <textPath href="#curve4">Auditing logic... Verifying integrity...</textPath>
                        </text>
                    </svg>
                </div>
                <div class="organic-bubble absolute inset-0 flex flex-col items-center justify-center p-2 text-center z-10 transition-transform group-hover:scale-105"
                    style="animation-delay: -4s; border-radius: 30% 70% 50% 50% / 50% 50% 30% 70%;">
                    <div class="w-7 h-7 rounded-full bg-slate-800 flex items-center justify-center mb-1">
                        <span class="material-symbols-outlined text-slate-400 text-lg">shield</span>
                    </div>
                    <span class="text-[9px] font-bold tracking-tighter text-slate-400 uppercase">QA</span>
                </div>
            </div>
        </aside>

        <!-- CENTRAL LOG / CONSOLE -->
        <section class="col-span-6 flex items-center justify-center relative">
            <div class="circular-editor w-full max-w-2xl border border-white/5 p-12 overflow-hidden">
                <div class="absolute inset-0 bg-radial-gradient from-[var(--purple-glow)]/5 to-transparent"></div>
                <!-- HUB ICON (Center) -->
                <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-20 pointer-events-none">
                    <div class="w-16 h-16 rounded-full bg-gradient-to-tr from-[var(--teal-glow)] to-[var(--purple-glow)] flex items-center justify-center shadow-[0_0_50px_rgba(168,85,247,0.4)] animate-[pulse_3s_infinite]"
                        id="hubIcon">
                        <span class="material-symbols-outlined text-white text-3xl">hub</span>
                    </div>
                </div>

                <div class="log-container relative z-10" id="console">
                    <div style="color: var(--text-muted); font-style: italic; text-align: center; margin-top: 40%;">
                        Factory offline. Awaiting neural input...</div>
                </div>
            </div>
        </section>

        <!-- PREVIEW AREA -->
        <aside class="col-span-3 flex flex-col justify-center relative overflow-visible">
            <div
                class="absolute inset-0 bg-gradient-to-l from-[var(--purple-glow)]/5 to-transparent blur-3xl rounded-full">
            </div>
            <div class="holo-projection p-6 rounded-3xl border border-white/10 backdrop-blur-sm h-3/4 flex flex-col">
                <div class="flex items-center justify-between mb-8">
                    <div class="flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-[var(--teal-glow)] animate-pulse"></span>
                        <h2 class="text-[10px] uppercase tracking-[0.3em] font-bold text-slate-400">Live Projection</h2>
                    </div>
                    <span class="material-symbols-outlined text-slate-500 text-sm">visibility</span>
                </div>
                <div class="flex-1 relative flex items-center justify-center overflow-hidden">
                    <div id="previewEmpty" class="text-[10px] text-slate-500 text-center px-6">
                        Build artifacts will be projected here upon synthesis.
                    </div>
                    <iframe id="previewFrame" src="about:blank" style="display: none;"></iframe>
                </div>
                <div class="mt-4 pt-4 border-t border-white/5">
                    <button id="syncBtn"
                        class="w-full py-3 rounded-full bg-white/5 border border-white/10 text-[10px] uppercase font-bold tracking-[0.2em] hover:bg-white/10 transition-all text-slate-300">
                        Synchronize Build
                    </button>
                </div>
            </div>
        </aside>
    </main>

    <!-- FLOATING INPUT BAR -->
    <div class="fixed bottom-8 left-1/2 -translate-x-1/2 w-full max-w-3xl px-6 z-50">
        <div
            class="bg-[rgba(15,23,42,0.8)] backdrop-blur-3xl rounded-full border border-white/10 p-2 pl-8 flex items-center gap-4 shadow-[0_20px_50px_rgba(0,0,0,0.5)]">
            <span class="material-symbols-outlined text-[var(--teal-glow)] text-sm animate-pulse">auto_awesome</span>
            <input id="taskInput"
                class="bg-transparent border-none focus:ring-0 text-sm flex-1 text-slate-300 placeholder-slate-600 outline-none"
                placeholder="Describe the software requirement..." type="text" />
            <button id="runBtn"
                class="px-8 py-3 rounded-full bg-gradient-to-r from-[var(--teal-glow)] to-[var(--purple-glow)] text-white text-[10px] font-black uppercase tracking-widest hover:brightness-110 transition-all flex items-center gap-2 group">
                Synthesize
                <span class="material-symbols-outlined text-sm group-hover:rotate-90 transition-transform">bolt</span>
            </button>
        </div>
    </div>

    <script>
        const runBtn = document.getElementById('runBtn');
        const taskInput = document.getElementById('taskInput');
        const consoleDiv = document.getElementById('console');
        const statusBadge = document.getElementById('statusBadge');
        const previewFrame = document.getElementById('previewFrame');
        const previewEmpty = document.getElementById('previewEmpty');
        const hubIcon = document.getElementById('hubIcon');
        const syncBtn = document.getElementById('syncBtn');

        let isFactoryRunning = false;
        let projectExists = false;

        function log(agent, text, files = []) {
            const div = document.createElement('div');
            div.className = 'log-entry';
            div.innerHTML = `
                <div class="log-agent">${agent}</div>
                <div class="log-text">${text.replace(/\n/g, '<br>')}</div>
                <div class="flex flex-wrap gap-2">
                    ${files.map(f => `<div class="log-file"><span class="material-symbols-outlined" style="font-size:10px">description</span> ${f}</div>`).join('')}
                </div>
            `;
            consoleDiv.appendChild(div);
            consoleDiv.scrollTop = consoleDiv.scrollHeight;
        }

        function setActiveNode(id) {
            document.querySelectorAll('.organic-bubble').forEach(n => {
                n.classList.remove('active');
                if (n.parentElement.id === id) n.classList.add('active');
            });
        }

        function executeFactory(prompt) {
            if (isFactoryRunning) return;

            isFactoryRunning = true;
            runBtn.disabled = true;
            runBtn.innerHTML = 'Synthesizing... <span class="material-symbols-outlined animate-spin text-sm">cycle</span>';
            statusBadge.innerText = 'PRODUCTION ACTIVE';
            statusBadge.classList.add('text-[var(--teal-glow)]');
            hubIcon.classList.add('animate-pulse');

            // Determine mode: if projectExists, use refine
            const mode = projectExists ? 'refine' : 'initial';
            const url = `/run?task=${encodeURIComponent(prompt)}&mode=${mode}`;
            const eventSource = new EventSource(url);

            eventSource.onmessage = (e) => {
                const data = JSON.parse(e.data);

                if (data.event === 'node') {
                    setActiveNode(data.node);
                } else if (data.event === 'log') {
                    log(data.agent, data.text, data.files || []);

                    if (data.agent.includes('DEVELOPER') || data.files?.some(f => f.endsWith('.html'))) {
                        projectExists = true;
                        previewEmpty.style.display = 'none';
                        previewFrame.style.display = 'block';
                        previewFrame.src = '/workspace/index.html?t=' + Date.now();
                    }
                } else if (data.event === 'complete') {
                    document.querySelectorAll('.relative[id^="node-"]').forEach(n => n.classList.add('complete'));
                    eventSource.close();
                    resetUI('COMPLETE');
                }
            };

            eventSource.onerror = () => {
                log('SYSTEM ERROR', 'Neural link severed. Agents offline.');
                eventSource.close();
                resetUI('ERROR');
            };
        }

        function resetUI(status) {
            isFactoryRunning = false;
            runBtn.disabled = false;
            runBtn.innerHTML = 'Synthesize <span class="material-symbols-outlined text-sm group-hover:rotate-90 transition-transform">bolt</span>';
            statusBadge.innerText = status;
            hubIcon.classList.remove('animate-pulse');
        }

        runBtn.addEventListener('click', () => {
            const val = taskInput.value.trim();
            if (!val) return;
            if (!isFactoryRunning) {
                if (!projectExists) consoleDiv.innerHTML = '';
                log('USER INTENT', val);
                executeFactory(val);
                taskInput.value = '';
            }
        });

        taskInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') runBtn.click();
        });

        syncBtn.addEventListener('click', () => {
            if (projectExists) {
                previewFrame.src = '/workspace/index.html?t=' + Date.now();
                log('SYSTEM', 'Synchronizing preview stream...');
            }
        });
    </script>
</body>

</html>
